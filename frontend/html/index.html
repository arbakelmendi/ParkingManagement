<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parking Management</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>

<h1>Parking Management System</h1>

<div class="container">

  <!-- Auth -->
  <section>
    <h2>Login</h2>

    <label>Email:</label>
    <input type="email" id="email" placeholder="admin@pm.com"><br>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Admin123!"><br>

    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <p id="authMsg"></p>
  </section>

  <!-- Parking Spots -->
  <section>
    <h2>Parking Spots</h2>
    <button onclick="loadSpots()">Load Spots</button>
    <table id="spotsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Spot Number</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Admin: Create Spot -->
  <section>
    <h2>Admin: Create Parking Spot</h2>

    <label>Parking ID:</label>
    <input type="number" id="adminParkingId" placeholder="1" /><br>

    <label>Spot Number:</label>
    <input type="number" id="adminSpotNumber" placeholder="200" /><br>

    <label>Status:</label>
    <select id="adminSpotStatus">
      <option value="free">free</option>
      <option value="occupied">occupied</option>
    </select><br>

    <button onclick="createSpot()">Create Spot</button>
    <p id="spotMsg"></p>
  </section>

  <!-- Reservations -->
  <section>
    <h2>Reservations</h2>
    <button onclick="loadReservations()">Load Reservations</button>

    <table id="reservationsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>User</th>
          <th>Spot</th>
          <th>Start</th>
          <th>End</th>
          <th>Cancel</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- New Reservation -->
  <section>
    <h2>Create Reservation</h2>

    <!-- ✅ User ID u hoq, sepse vjen nga JWT -->

    <label>Spot ID:</label>
    <input type="number" id="spotId"><br>

    <label>Start Time:</label>
    <input type="datetime-local" id="startTime"><br>

    <label>End Time:</label>
    <input type="datetime-local" id="endTime"><br>

    <button onclick="createReservation()">Create Reservation</button>

    <p id="message"></p>
  </section>

</div>

<script src="../js/script.js"></script>
</body>
</html>
